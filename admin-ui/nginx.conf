server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Dedicated health endpoint for the container healthcheck.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Phase 9 SPA: serve static assets, fall back to index.html for client
    # routing. The SPA calls the backend API directly (JWT); no API proxying
    # is configured here by default.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
