server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Dedicated health endpoint for the container healthcheck.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Same-origin API proxy (Phase 9 SPA). Serving the SPA and the API from one
    # origin lets the refresh token live in an httpOnly, same-site cookie instead
    # of JS-readable storage. The SPA calls /api/...; the /api prefix is stripped
    # here (trailing slash on proxy_pass) so the backend sees /auth, /chat, etc.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Stream Server-Sent Events (chat answers) unbuffered.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;

        # Document uploads.
        client_max_body_size 64m;
    }

    # SPA: static assets, fall back to index.html for client routing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
