# Prometheus scrape config (Phase 5). Prod only; the dev stack has no
# Prometheus/Grafana (Phoenix covers dev tracing). Scrapes:
#   - backend  /metrics  : rag_* app metrics (latency histogram, cache, gauges)
#   - vllm     /metrics  : vLLM serving metrics (queue wait, tokens/s, KV cache)
#   - dcgm     /metrics  : GPU utilization/memory (NVIDIA DCGM exporter — the
#                          operator runs this on the GPU host; commented until then)
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]

  - job_name: vllm
    metrics_path: /metrics
    static_configs:
      - targets: ["vllm:8000"]

  # GPU metrics via NVIDIA DCGM exporter (operator provisioning on the GPU host).
  # - job_name: dcgm
  #   static_configs:
  #     - targets: ["dcgm-exporter:9400"]
