# Production reverse proxy (TLS termination is added in Phase 8 hardening).
# Routes the admin SPA and the API behind a single origin.

upstream backend_api { server backend:8000; }
upstream admin_spa   { server admin-ui:80; }

server {
    listen 80;
    server_name _;

    client_max_body_size 100m;   # document uploads

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # API (REST + SSE streaming for /chat).
    location /api/ {
        proxy_pass http://backend_api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE: disable buffering so tokens stream through.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # Admin SPA.
    location / {
        proxy_pass http://admin_spa;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
