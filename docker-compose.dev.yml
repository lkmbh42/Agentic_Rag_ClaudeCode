# ============================================================================
# DEVELOPMENT stack — Windows 11 laptop, Docker Desktop + WSL2, CPU-only.
# Self-contained: run exactly one command (per Phase 1 DoD):
#
#     docker compose -f docker-compose.dev.yml up
#
# Differences vs prod (see docs/dev-vs-prod.md):
#   - LLM = Ollama (CPU), NOT vLLM/GPU
#   - visual path = degraded -> no `vlm` service
#   - no reverse proxy
#   - reduced concurrency, source bind-mounts + --reload for fast iteration
# ============================================================================
name: agentic-rag-dev

x-common-env: &common-env
  env_file: [.env]

services:
  # --------------------------------------------------------------------- data
  postgres:
    image: postgres:16-alpine@sha256:e013e867e712fec275706a6c51c966f0bb0c93cfa8f51000f85a15f9865a28cb
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag}
      POSTGRES_DB: ${POSTGRES_DB:-rag}
    # Host-published port is separate from the in-network port (5432) the app
    # uses, so it can be remapped to dodge collisions with other local stacks.
    ports: ["${POSTGRES_HOST_PORT:-5432}:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rag} -d ${POSTGRES_DB:-rag}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    ports: ["${REDIS_HOST_PORT:-6379}:6379"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  qdrant:
    image: qdrant/qdrant:v1.12.4@sha256:241edb9d7778327516ef218f8c74e1bd61b5ea42cd4f193cb8d0896199705636
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes: ["qdrant_data:/qdrant/storage"]
    healthcheck:
      # qdrant image is debian-slim (has bash); TCP-connect liveness on the HTTP port.
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  phoenix:
    image: arizephoenix/phoenix:latest@sha256:45a2dbd623d12f9924dc3d554a3f35574764541d7375d081787f0e06e4d3f2fa
    ports:
      - "${PHOENIX_PORT:-6006}:6006"
      - "4317:4317"
    volumes: ["phoenix_data:/mnt/data"]
    environment:
      PHOENIX_WORKING_DIR: /mnt/data
    healthcheck:
      # Phoenix image is distroless (no shell) -> exec-form CMD, not CMD-SHELL.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:6006/healthz',timeout=3).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  minio:
    # Object store for figure crops + page renders (Phase 2). Same pinned digest
    # as prod; dev additionally publishes the API/console ports for debugging.
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z@sha256:a1ea29fa28355559ef137d71fc570e508a214ec84ff8083e39bc5428980b015e
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin-dev-only}
      MINIO_KMS_SECRET_KEY: ${MINIO_KMS_SECRET_KEY:-minio-default-key:bXktZGV2LW9ubHktMzItYnl0ZS1rbXMta2V5LTEyMzQ=}
      MINIO_KMS_AUTO_ENCRYPTION: "on"
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes: ["minio_data:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ----------------------------------------------------------------- inference
  # DEV-ONLY DEVIATION from Phase 1 DoD ("Ollama removed from compose"): the dev
  # host is CPU-only — the official vLLM image requires CUDA, so Ollama remains
  # the dev OpenAI-compatible backend. Prod compose serves vLLM exclusively.
  # Flagged as a hardware constraint at the Phase 1 gate; digest-pinned meanwhile.
  ollama:
    image: ollama/ollama:latest@sha256:1685741456770df6e3cceb2a945a5f75e020f658d1701509668d6f4688f1dd3f
    ports: ["11434:11434"]
    # Keep the VL model resident during a figure-captioning batch (avoids a
    # ~2-min reload between figures, since each caption takes longer than the
    # 5-min default idle unload).
    environment:
      OLLAMA_KEEP_ALIVE: "-1"
    volumes: ["ollama_data:/root/.ollama"]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  embeddings:
    build:
      context: .
      dockerfile: docker/embeddings.Dockerfile
      args:
        # Dev override: build the REAL BGE-M3 + reranker image (torch + FlagEmbedding).
        INSTALL_MODELS: "true"
    <<: *common-env
    environment:
      EMBEDDINGS_DEVICE: cpu
      EMBEDDINGS_IMPLEMENTED: "true"   # serve real BGE-M3 (downloads on first /embed)
    # Persist the Hugging Face model cache so BGE-M3 (~2.3 GB) downloads once.
    volumes:
      - hf_cache:/home/appuser/.cache/huggingface
    ports: ["${EMBEDDINGS_PORT:-8001}:8001"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8001/health',timeout=3).status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Dev figure captioner (real charts, no GPU): captions via a local quantized
  # Ollama vision model over the OpenAI-compatible API. Enabled by VISUAL_PATH=full.
  vlm:
    build:
      context: .
      dockerfile: docker/vlm.Dockerfile
    <<: *common-env
    environment:
      VLM_BACKEND: openai                     # caption via Ollama, not in-process transformers
      VLM_BASE_URL: http://ollama:11434/v1    # the vlm service -> Ollama (worker -> vlm:8002)
      VLM_MODEL: ${VLM_MODEL:-qwen2.5vl:7b}
      VLM_DEVICE: cpu
      VLM_TIMEOUT_S: "900"                     # 7B VL on CPU is slow; generous per-caption budget
    depends_on:
      ollama: {condition: service_started}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8002/health',timeout=3).status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ------------------------------------------------------------------- app tier
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    <<: *common-env
    # Bind-mount source + hot reload for fast dev iteration.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./app:/srv/app
      - ./worker:/srv/worker
      - documents_data:/data        # shared with worker: backend writes uploads
    ports: ["${BACKEND_PORT:-8000}:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      qdrant: {condition: service_healthy}
      ollama: {condition: service_started}
      embeddings: {condition: service_started}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health',timeout=3).status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    <<: *common-env
    command: ["python", "-m", "worker.main"]
    environment:
      WORKER_HEARTBEAT_PATH: /tmp/worker_heartbeat
    volumes:
      - ./app:/srv/app
      - ./worker:/srv/worker
      - documents_data:/data        # shared with backend: worker reads uploads
    depends_on:
      redis: {condition: service_healthy}
      postgres: {condition: service_healthy}
      minio: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os,time,sys; p=os.environ.get('WORKER_HEARTBEAT_PATH','/tmp/worker_heartbeat'); sys.exit(0 if os.path.exists(p) and time.time()-os.path.getmtime(p)<300 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  admin-ui:
    build:
      context: .
      dockerfile: docker/admin-ui.Dockerfile
    ports: ["${ADMIN_UI_PORT:-8080}:80"]
    healthcheck:
      # 127.0.0.1 (not localhost): nginx listens on IPv4; busybox wget tries ::1 first.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  phoenix_data:
  ollama_data:
  documents_data:
  minio_data:
  hf_cache:        # BGE-M3 model cache (dev real-embedder mode)
