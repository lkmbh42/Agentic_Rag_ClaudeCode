# ============================================================================
# PRODUCTION stack — company server, single ~24 GB NVIDIA GPU, air-gapped at
# runtime. Self-contained:
#
#     docker compose up -d
#
# Differences vs dev (see docs/dev-vs-prod.md):
#   - LLM = vLLM single instance on GPU (NOT Ollama)
#   - visual path = full -> `vlm` service runs (CPU at ingest)
#   - reverse proxy in front of backend + admin-ui
#   - models are PRE-STAGED and mounted; zero runtime downloads
#
# Requires the NVIDIA Container Toolkit on the host.
# GPU/VRAM tuning: see ADR 0.5 and docs/dev-vs-prod.md (24 GB budget).
# ============================================================================
name: agentic-rag

x-common-env: &common-env
  env_file: [.env]

x-restart: &restart
  restart: unless-stopped

services:
  # --------------------------------------------------------------------- data
  postgres:
    image: postgres:16-alpine
    <<: *restart
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    <<: *restart
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  qdrant:
    image: qdrant/qdrant:v1.12.4
    <<: *restart
    volumes: ["qdrant_data:/qdrant/storage"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  phoenix:
    image: arizephoenix/phoenix:latest
    <<: *restart
    volumes: ["phoenix_data:/mnt/data"]
    environment:
      PHOENIX_WORKING_DIR: /mnt/data
    healthcheck:
      # Phoenix image is distroless (no shell) -> exec-form CMD, not CMD-SHELL.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:6006/healthz',timeout=3).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  # ----------------------------------------------------------------- inference
  vllm:
    image: vllm/vllm-openai:latest
    <<: *restart
    # IPC/shm: vLLM needs ample shared memory or it crashes under concurrency.
    ipc: host
    shm_size: "8gb"
    # Pre-staged weights mounted read-only; no runtime download (air-gapped).
    volumes:
      - ${MODELS_DIR:-./models}:/models:ro
    command:
      - "--model=${VLLM_MODEL_PATH:-/models/qwen2.5-7b-instruct-awq}"
      - "--served-model-name=${VLLM_SERVED_MODEL_NAME:-qwen2.5-7b-awq}"
      - "--quantization=${VLLM_QUANTIZATION:-awq}"
      - "--max-model-len=${VLLM_MAX_MODEL_LEN:-8192}"
      - "--max-num-seqs=${VLLM_MAX_NUM_SEQS:-48}"
      - "--gpu-memory-utilization=${VLLM_GPU_MEMORY_UTILIZATION:-0.72}"
      - "--tensor-parallel-size=${VLLM_TENSOR_PARALLEL_SIZE:-1}"
      - "--scheduling-policy=${VLLM_SCHEDULING_POLICY:-priority}"
      - "--guided-decoding-backend=${VLLM_GUIDED_DECODING_BACKEND:-xgrammar}"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health',timeout=3).status==200 else 1)\""]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 300s   # weight load + CUDA graph capture can take minutes

  embeddings:
    build:
      context: .
      dockerfile: docker/embeddings.Dockerfile
      args:
        INSTALL_MODELS: "true"   # build the real BGE-M3 + reranker image
    <<: *common-env
    environment:
      EMBEDDINGS_DEVICE: cuda    # BGE-M3 + reranker on GPU
      EMBEDDINGS_IMPLEMENTED: "true"
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-/models/bge-m3}
      RERANKER_MODEL: ${RERANKER_MODEL:-/models/bge-reranker-v2-m3}
    volumes:
      - ${MODELS_DIR:-./models}:/models:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8001/health',timeout=3).status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  vlm:
    build:
      context: .
      dockerfile: docker/vlm.Dockerfile
    <<: *common-env
    # CPU only by design (ADR 0.3): keeps the 24 GB GPU free for interactive load.
    environment:
      VLM_DEVICE: cpu
      VISUAL_PATH: full
    volumes:
      - ${MODELS_DIR:-./models}:/models:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8002/health',timeout=3).status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  # ------------------------------------------------------------------- app tier
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    <<: [*common-env, *restart]
    environment:
      LLM_BASE_URL: ${LLM_BASE_URL:-http://vllm:8000/v1}
      LLM_GEN_MODEL: ${VLLM_SERVED_MODEL_NAME:-qwen2.5-7b-awq}
      LLM_CLASS_MODEL: ${VLLM_SERVED_MODEL_NAME:-qwen2.5-7b-awq}
      EMBEDDINGS_BACKEND: service
      RERANKER_BACKEND: service
    volumes:
      - documents_data:/data
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      qdrant: {condition: service_healthy}
      vllm: {condition: service_healthy}
      embeddings: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health',timeout=3).status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    <<: [*common-env, *restart]
    command: ["python", "-m", "worker.main"]
    environment:
      WORKER_HEARTBEAT_PATH: /tmp/worker_heartbeat
      LLM_BASE_URL: ${LLM_BASE_URL:-http://vllm:8000/v1}
      EMBEDDINGS_BACKEND: service
      RERANKER_BACKEND: service
    volumes:
      - documents_data:/data
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      qdrant: {condition: service_healthy}
      vlm: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os,time,sys; p=os.environ.get('WORKER_HEARTBEAT_PATH','/tmp/worker_heartbeat'); sys.exit(0 if os.path.exists(p) and time.time()-os.path.getmtime(p)<20 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  admin-ui:
    build:
      context: .
      dockerfile: docker/admin-ui.Dockerfile
    <<: *restart
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  proxy:
    image: nginx:1.27-alpine
    <<: *restart
    ports:
      - "${PROXY_HTTP_PORT:-80}:80"
    volumes:
      - ./docker/proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend: {condition: service_healthy}
      admin-ui: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  phoenix_data:
  documents_data:
