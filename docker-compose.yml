# ============================================================================
# PRODUCTION stack — company server, single ~24 GB NVIDIA GPU, air-gapped at
# runtime. Self-contained:
#
#     docker compose up -d
#
# Differences vs dev (see docs/dev-vs-prod.md):
#   - LLM = vLLM single instance on GPU (NOT Ollama)
#   - visual path = full -> `vlm` service runs (CPU at ingest)
#   - reverse proxy in front of backend + admin-ui
#   - models are PRE-STAGED and mounted; zero runtime downloads
#
# Requires the NVIDIA Container Toolkit on the host.
# GPU/VRAM tuning: see ADR 0.5 and docs/dev-vs-prod.md (24 GB budget).
# ============================================================================
name: agentic-rag

x-common-env: &common-env
  env_file: [.env]

x-restart: &restart
  restart: unless-stopped

services:
  # --------------------------------------------------------------------- data
  postgres:
    image: postgres:16-alpine@sha256:e013e867e712fec275706a6c51c966f0bb0c93cfa8f51000f85a15f9865a28cb
    <<: *restart
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    <<: *restart
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  qdrant:
    image: qdrant/qdrant:v1.12.4@sha256:241edb9d7778327516ef218f8c74e1bd61b5ea42cd4f193cb8d0896199705636
    <<: *restart
    volumes: ["qdrant_data:/qdrant/storage"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  phoenix:
    image: arizephoenix/phoenix:latest@sha256:45a2dbd623d12f9924dc3d554a3f35574764541d7375d081787f0e06e4d3f2fa
    <<: *restart
    volumes: ["phoenix_data:/mnt/data"]
    environment:
      PHOENIX_WORKING_DIR: /mnt/data
    healthcheck:
      # Phoenix image is distroless (no shell) -> exec-form CMD, not CMD-SHELL.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:6006/healthz',timeout=3).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  minio:
    # Object store for figure crops + page renders (Phase 2). Digest-pinned
    # (docs/PINS.md). INTERNAL NETWORK ONLY — no host ports; access is always
    # gateway-proxied with ACL checks (Rule 5). SSE-S3 via built-in KMS key.
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z@sha256:a1ea29fa28355559ef137d71fc570e508a214ec84ff8083e39bc5428980b015e
    <<: *restart
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      # Enables SSE-S3 (server-side encryption) without an external KES:
      # "minio-default-key:<base64 32-byte key>" — operator-generated, .env only.
      MINIO_KMS_SECRET_KEY: ${MINIO_KMS_SECRET_KEY}
      # Encrypt EVERY object at rest regardless of client headers (spec: SSE on).
      MINIO_KMS_AUTO_ENCRYPTION: "on"
    volumes: ["minio_data:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ----------------------------------------------------------------- inference
  vllm:
    # Digest-pinned (docs/PINS.md; resolved 2026-07-02). Update = new digest in
    # PINS.md + eval gate re-run (see model update procedure, Phase 5 runbook).
    image: vllm/vllm-openai:latest@sha256:251eba5cc7c12fed0b75da22a9240e582b1c9e39f6fbc064f86781b963bd814f
    <<: *restart
    # IPC/shm: vLLM needs ample shared memory or it crashes under concurrency.
    ipc: host
    shm_size: "8gb"
    # Pre-staged weights mounted read-only; no runtime download (air-gapped).
    volumes:
      - ${MODELS_DIR:-./models}:/models:ro
    command:
      - "--model=${VLLM_MODEL_PATH:-/models/qwen2.5-7b-instruct-awq}"
      - "--served-model-name=${VLLM_SERVED_MODEL_NAME:-qwen2.5-7b-awq}"
      - "--quantization=${VLLM_QUANTIZATION:-awq}"
      - "--max-model-len=${VLLM_MAX_MODEL_LEN:-8192}"
      - "--max-num-seqs=${VLLM_MAX_NUM_SEQS:-48}"
      - "--gpu-memory-utilization=${VLLM_GPU_MEMORY_UTILIZATION:-0.72}"
      - "--tensor-parallel-size=${VLLM_TENSOR_PARALLEL_SIZE:-1}"
      - "--scheduling-policy=${VLLM_SCHEDULING_POLICY:-priority}"
      - "--guided-decoding-backend=${VLLM_GUIDED_DECODING_BACKEND:-xgrammar}"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health',timeout=3).status==200 else 1)\""]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 300s   # weight load + CUDA graph capture can take minutes

  embeddings:
    build:
      context: .
      dockerfile: docker/embeddings.Dockerfile
      args:
        INSTALL_MODELS: "true"   # build the real BGE-M3 + reranker image
    <<: *common-env
    environment:
      EMBEDDINGS_DEVICE: cuda    # BGE-M3 + reranker on GPU
      EMBEDDINGS_IMPLEMENTED: "true"
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-/models/bge-m3}
      RERANKER_MODEL: ${RERANKER_MODEL:-/models/bge-reranker-v2-m3}
    volumes:
      - ${MODELS_DIR:-./models}:/models:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8001/health',timeout=3).status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  vlm:
    build:
      context: .
      dockerfile: docker/vlm.Dockerfile
    <<: *common-env
    # CPU only by design (ADR 0.3): keeps the 24 GB GPU free for interactive load.
    environment:
      VLM_DEVICE: cpu
      VISUAL_PATH: full
      VLM_MODEL: ${VLM_MODEL:-Qwen/Qwen2.5-VL-7B-Instruct}
      # Real captioning on prod; flip to load the model. Default stub is safe.
      VLM_IMPLEMENTED: ${VLM_IMPLEMENTED:-true}
    volumes:
      - ${MODELS_DIR:-./models}:/models:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8002/health',timeout=3).status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  colqwen:
    build:
      context: .
      dockerfile: docker/colqwen.Dockerfile
    <<: *common-env
    # GPU at query + ingest (late-interaction page retrieval). Stub build runs
    # CPU; the real model build sets COLQWEN_IMPLEMENTED=true and needs a GPU.
    environment:
      COLQWEN_DEVICE: ${COLQWEN_DEVICE:-cuda}
      COLQWEN_MODEL: ${COLQWEN_MODEL:-vidore/colqwen2-v1.0}
      COLQWEN_IMPLEMENTED: ${COLQWEN_IMPLEMENTED:-true}
      COLQWEN_DIM: ${COLQWEN_DIM:-128}
    volumes:
      - ${MODELS_DIR:-./models}:/models:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8003/health',timeout=3).status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  # ------------------------------------------------------------------- app tier
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    <<: [*common-env, *restart]
    environment:
      LLM_BACKEND: vllm
      LLM_BASE_URL: ${LLM_BASE_URL:-http://vllm:8000/v1}
      LLM_GEN_MODEL: ${LLM_GEN_MODEL:-${VLLM_SERVED_MODEL_NAME:-qwen2.5-7b-awq}}
      LLM_CLASS_MODEL: ${LLM_CLASS_MODEL:-${VLLM_SERVED_MODEL_NAME:-qwen2.5-7b-awq}}
      # Phase 4: false per the ratified ADR (24 GB: text 7B-AWQ, zero
      # query-time VLM). The VL overlay (.env.example) flips it on >=48 GB.
      LLM_MULTIMODAL: ${LLM_MULTIMODAL:-false}
      EMBEDDINGS_BACKEND: service
      RERANKER_BACKEND: service
    volumes:
      - documents_data:/data
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      qdrant: {condition: service_healthy}
      vllm: {condition: service_healthy}
      embeddings: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health',timeout=3).status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    <<: [*common-env, *restart]
    command: ["python", "-m", "worker.main"]
    environment:
      WORKER_HEARTBEAT_PATH: /tmp/worker_heartbeat
      LLM_BACKEND: vllm
      LLM_BASE_URL: ${LLM_BASE_URL:-http://vllm:8000/v1}
      EMBEDDINGS_BACKEND: service
      RERANKER_BACKEND: service
      # Docling parses in the worker; artifacts pre-staged, loaded offline (Rule 2).
      DOCLING_ARTIFACTS_PATH: ${DOCLING_ARTIFACTS_PATH:-/models/docling}
    volumes:
      - documents_data:/data
      - ${MODELS_DIR:-./models}:/models:ro
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      qdrant: {condition: service_healthy}
      vlm: {condition: service_healthy}
      minio: {condition: service_healthy}
      colqwen: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os,time,sys; p=os.environ.get('WORKER_HEARTBEAT_PATH','/tmp/worker_heartbeat'); sys.exit(0 if os.path.exists(p) and time.time()-os.path.getmtime(p)<300 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  admin-ui:
    build:
      context: .
      dockerfile: docker/admin-ui.Dockerfile
    <<: *restart
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  proxy:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    <<: *restart
    ports:
      - "${PROXY_HTTP_PORT:-80}:80"
    volumes:
      - ./docker/proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend: {condition: service_healthy}
      admin-ui: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # --- Observability (Phase 5). Internal-only; not exposed through the proxy.
  prometheus:
    image: prom/prometheus:v2.54.1@sha256:f6639335d34a77d9d9db382b92eeb7fc00934be8eae81dbc03b31cfe90411a94
    <<: *restart
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      backend: {condition: service_healthy}

  grafana:
    image: grafana/grafana:11.2.0@sha256:408afb9726de5122b00a2576763a8a57a3c86d5b0eff5305bc994ceb3eb96c3f
    <<: *restart
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./ops/grafana:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus: {condition: service_started}

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  phoenix_data:
  documents_data:
  minio_data:
  prometheus_data:
  grafana_data:
